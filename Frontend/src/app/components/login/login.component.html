<div class="login-container">
  <div class="login-card">
    <h2>Login</h2>

    <p class="subtitle">
      Sign in to search and bookmark repositories
    </p>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label for="username">
          Username
        </label>

        <input
          id="username"
          type="text"
          [(ngModel)]="username"
          name="username"
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          autocomplete="current-password"
        />
      </div>

      @if (error) {
        <div class="error">
          {{ error }}
        </div>
      }

      <button
        type="submit"
        [disabled]="loading"
      >
        {{ loading ? 'Logging in…' : 'Login' }}
      </button>
    </form>
  </div>
</div>
