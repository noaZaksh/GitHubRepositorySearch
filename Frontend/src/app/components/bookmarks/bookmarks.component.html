<div class="bookmarks-page">
  <header class="bookmarks-header">
    <div>
      <h1>My Bookmarks</h1>
      <p>Repositories you saved for later</p>
    </div>
  </header>

  @if (loading()) {
    <div class="status">
      Loading bookmarks…
    </div>
  } @else if (error()) {
    <div class="error">
      {{ error() }}
    </div>
  } @else if (bookmarks().length === 0) {
    <div class="empty">
      <div class="empty-icon">☆</div>
      <h2>No bookmarks yet</h2>
      <p>Search for repositories and bookmark the ones you like.</p>
    </div>
  } @else {
    <div class="cards">
      @for (repo of bookmarks(); track repo.id) {
        <app-repository-card
          [repo]="repo"
          [bookmarked]="true"
          (bookmarkToggle)="removeBookmark(repo)"
        />
      }
    </div>
  }
</div>
